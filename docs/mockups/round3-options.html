<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MonoMusic round 3</title><style>
/* Kompakt screens at 2/3 of 480x800 px: app dp x 0.889 = px here (21sp label = 18.7px, 76dp row = 67.5px). */
:root { --paper:#fff; --ink:#000; --ground:#efeee9; --font:system-ui,"Roboto","Helvetica Neue",Arial,sans-serif; color-scheme:light; }
* { box-sizing:border-box; }
body { background:var(--ground); color:var(--ink); font-family:var(--font); margin:0; }
.wrap { max-width:1400px; margin:0 auto; padding:28px 16px 56px; }
h1 { font-size:30px; font-weight:900; margin:0 0 8px; }
.lede { font-size:16px; line-height:1.5; max-width:78ch; margin:0 0 6px; }
section { padding-block:24px; border-top:2px solid var(--ink); }
section > h2 { font-size:22px; font-weight:900; margin:0 0 6px; }
section > p { font-size:15px; line-height:1.5; max-width:80ch; margin:0 0 14px; }
.grid { display:flex; flex-wrap:wrap; gap:26px; align-items:flex-start; }
figure { margin:0; width:320px; max-width:100%; }
figcaption { margin-top:10px; font-size:14px; line-height:1.45; }
figcaption b { font-size:16px; font-weight:900; display:block; margin-bottom:2px; }
.cur, .rec { display:inline-block; font-size:11px; font-weight:700; padding:1px 8px; border-radius:999px; margin-left:6px; vertical-align:2px; }
.cur { border:1.5px solid var(--ink); background:var(--paper); }
.rec { background:var(--ink); color:var(--paper); }

.phone { width:320px; height:534px; background:var(--paper); border:2px solid var(--ink); border-radius:18px; overflow:hidden; display:flex; flex-direction:column; }
.status { height:30px; flex:none; display:flex; justify-content:space-between; align-items:center; padding:0 14px; font-size:15px; font-weight:500; }
.top { height:57px; flex:none; display:flex; align-items:center; gap:8px; padding:0 10px 0 12px; border-bottom:2.7px solid var(--ink); }
.top .t { flex:1; font-size:21px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.top .i { font-size:19px; width:30px; text-align:center; flex:none; }
.top .i.on { background:var(--ink); color:var(--paper); border-radius:8px; height:30px; line-height:30px; }
.btn { flex:none; font-size:13px; font-weight:700; padding:6px 10px; border-radius:8px; background:var(--ink); color:var(--paper); }
.pill { flex:1; height:40px; border:1.8px solid var(--ink); border-radius:99px; display:flex; align-items:center; gap:8px; padding:0 14px; font-size:16px; }
.body { flex:1; overflow:hidden; min-height:0; position:relative; }
.tabs { display:flex; height:40px; border-bottom:1.5px solid var(--ink); flex:none; }
.tabs div { flex:1; display:flex; align-items:center; justify-content:center; font-size:14px; }
.tabs div.on { font-weight:900; box-shadow:inset 0 -3px 0 var(--ink); }
.chips { display:flex; gap:6px; padding:8px 10px; flex:none; flex-wrap:nowrap; }
.chip { border:1.8px solid var(--ink); border-radius:16px; height:28px; padding:0 10px; display:flex; align-items:center; font-size:13px; }
.chip.on { background:var(--ink); color:var(--paper); }
.sect { font-size:14px; font-weight:700; padding:10px 14px 2px; display:flex; justify-content:space-between; }
.row { height:67.5px; display:flex; align-items:center; gap:12px; padding:0 10px 0 14px; position:relative; }
.row::after { content:""; position:absolute; left:14px; right:0; bottom:0; border-bottom:1.2px dotted var(--ink); }
.row.last::after { display:none; }
.row.one { height:52px; }
.row .g { flex:1; min-width:0; }
.row .l { font-size:18.7px; font-weight:900; line-height:20px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .l.n { font-weight:400; }
.row .s2 { font-size:16px; line-height:16px; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chev { font-size:18px; width:20px; text-align:center; flex:none; }
.nav { height:51px; flex:none; border-top:1.8px solid var(--ink); display:flex; }
.nav div { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12.5px; gap:2px; }
.nav div span { font-size:15px; }
.nav div.on { font-weight:900; box-shadow:inset 0 -3.5px 0 var(--ink); }
.mini { height:52px; flex:none; border-top:2.7px solid var(--ink); display:flex; align-items:center; gap:10px; padding:0 10px 0 14px; }
.mini .g { flex:1; min-width:0; }
.mini .l { font-size:16px; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mini .s2 { font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mini .pp { width:38px; height:38px; border:1.8px solid var(--ink); border-radius:50%; display:grid; place-items:center; font-size:15px; flex:none; }
.np { padding:18px 16px 0; display:flex; flex-direction:column; gap:6px; }
.np .title { font-size:28px; font-weight:900; line-height:1.1; }
.np .artist { font-size:18px; text-decoration:underline; }
.np .album { font-size:16px; }
.np .time { font-size:16px; margin-top:12px; }
.bar { height:8px; border:1.2px solid var(--ink); border-radius:4px; margin-top:8px; position:relative; }
.bar i { position:absolute; left:0; top:0; bottom:0; width:45%; background:var(--ink); }
.ctrls { display:flex; justify-content:space-around; align-items:center; margin-top:22px; }
.ctrls div { width:52px; height:52px; border:1.8px solid var(--ink); border-radius:50%; display:grid; place-items:center; font-size:20px; }
.ctrls div.big { width:64px; height:64px; background:var(--ink); color:var(--paper); font-size:24px; }
.small { display:flex; justify-content:space-around; margin-top:18px; font-size:14px; }
.small span { border:1.5px solid var(--ink); border-radius:8px; padding:4px 10px; }
</style><style>
.tile { width:43px; height:43px; border:1.2px solid var(--ink); border-radius:4px; flex:none; display:grid; place-items:center; font-weight:900; font-size:16px; background:repeating-linear-gradient(45deg,#000 0 2px,#fff 2px 5px); }
.tile.ini { background:#fff; }
.dots { width:30px; text-align:center; font-size:20px; flex:none; }
.sheet { position:absolute; left:0; right:0; bottom:0; background:#fff; border-top:2.7px solid var(--ink); padding-bottom:6px; }
.sheet .h { display:flex; justify-content:space-between; padding:10px 14px 4px; font-weight:900; font-size:18px; }
.act { height:46px; display:flex; align-items:center; padding:0 14px; font-size:16px; position:relative; }
.act::after { content:""; position:absolute; left:14px; right:0; bottom:0; border-bottom:1.2px dotted var(--ink); }
.act:last-child::after { display:none; }
.np { padding:12px 14px; }
.np .row2 { display:flex; gap:12px; align-items:flex-end; }
.np .t { font-size:22px; font-weight:900; }
.chipsrow { display:flex; gap:6px; padding:10px 14px; flex-wrap:wrap; }
.chip { border:1.8px solid var(--ink); border-radius:16px; height:28px; padding:0 10px; display:flex; align-items:center; font-size:13px; }
</style></head><body><div class="wrap"><h1>MonoMusic — round 3: pick one letter per question</h1><p class="lede">Design questions from the review. Performance fixes need no choice and are listed in the reply.</p><section><h2>1 · Doing things to a song (replaces hold → menu)</h2><div class="grid"><figure><div class="phone" style="position:relative"><div class="status"><span>16:30</span><span>▮▮▮</span></div><div class="top"><div class="t">Songs</div><div class="i">☰</div><div class="i">⌕</div><div class="i">⤓</div><div class="i">⚙</div></div><div class="body"><div class="row"><div class="g"><div class="l">Acts Of Magic</div><div class="s2">Boards of Canada · 1:18</div></div></div><div class="row"><div class="g"><div class="l">Age Of Capricorn</div><div class="s2">Boards of Canada · 3:52</div></div></div><div class="row"><div class="g"><div class="l">All At Once</div><div class="s2">Ninajirachi · 2:41</div></div></div><div class="row"><div class="g"><div class="l">All I Am</div><div class="s2">Ninajirachi · 3:05</div></div></div></div><div class="mini"><div class="g"><div class="l">Battery Death</div><div class="s2">Ninajirachi</div></div><div class="pp">▶</div></div><div class="nav"><div><span>♫</span>Playlists</div><div><span>☺</span>Artists</div><div class="on"><span>≡</span>Songs</div><div><span>◉</span>Albums</div></div></div><figcaption><b>Now <span class="cur">now</span></b>Hold a song → a menu (Add to playlist, Edit, Delete). MMD says hold is not a menu trigger (P6), and nothing on screen says it exists.</figcaption></figure><figure><div class="phone" style="position:relative"><div class="status"><span>16:30</span><span>▮▮▮</span></div><div class="top"><div class="t">Songs</div><div class="i">☰</div><div class="i">⌕</div><div class="i">⤓</div><div class="i">⚙</div></div><div class="body"><div class="row"><div class="g"><div class="l">Acts Of Magic</div><div class="s2">Boards of Canada · 1:18</div></div><div class="dots">⋮</div></div><div class="row"><div class="g"><div class="l">Age Of Capricorn</div><div class="s2">Boards of Canada · 3:52</div></div><div class="dots">⋮</div></div><div class="row"><div class="g"><div class="l">All At Once</div><div class="s2">Ninajirachi · 2:41</div></div><div class="dots">⋮</div></div><div class="row"><div class="g"><div class="l">All I Am</div><div class="s2">Ninajirachi · 3:05</div></div><div class="dots">⋮</div></div><div class="sheet"><div class="h"><span>Acts Of Magic</span><span>✕</span></div><div class="act">Play next</div><div class="act">Add to queue</div><div class="act">Add to playlist</div><div class="act">Go to album</div><div class="act">Go to artist</div></div></div><div class="mini"><div class="g"><div class="l">Battery Death</div><div class="s2">Ninajirachi</div></div><div class="pp">▶</div></div><div class="nav"><div><span>♫</span>Playlists</div><div><span>☺</span>Artists</div><div class="on"><span>≡</span>Songs</div><div><span>◉</span>Albums</div></div></div><figcaption><b>A · ⋮ on every row <span class="rec">suggested</span></b>A ⋮ at the right of each song opens a sheet: Play next · Add to queue · Add to playlist · Go to album · Go to artist · Download/Delete. Visible, one tap more. Hold is free for select (P7).</figcaption></figure><figure><div class="phone" style="position:relative"><div class="status"><span>16:30</span><span>▮▮▮</span></div><div class="top"><div class="t">Songs</div><div class="i">☰</div><div class="i">⌕</div><div class="i">⤓</div><div class="i">⚙</div></div><div class="body"><div class="row"><div class="g"><div class="l">Acts Of Magic</div><div class="s2">Boards of Canada · 1:18</div></div></div><div class="row"><div class="g"><div class="l">Age Of Capricorn</div><div class="s2">Boards of Canada · 3:52</div></div></div><div class="row"><div class="g"><div class="l">All At Once</div><div class="s2">Ninajirachi · 2:41</div></div></div><div class="row"><div class="g"><div class="l">All I Am</div><div class="s2">Ninajirachi · 3:05</div></div></div></div><div class="mini"><div class="g"><div class="l">Battery Death</div><div class="s2">Ninajirachi</div></div><div class="pp">▶</div></div><div class="nav"><div><span>♫</span>Playlists</div><div><span>☺</span>Artists</div><div class="on"><span>≡</span>Songs</div><div><span>◉</span>Albums</div></div></div><figcaption><b>B · Actions on Now Playing only </b>Rows only play. Everything you do to a song happens on Now Playing (it has Queue and Add to playlist already; add Go to album, Download). Cleanest rows, but you must play a song to act on it.</figcaption></figure><figure><div class="phone" style="position:relative"><div class="status"><span>16:30</span><span>▮▮▮</span></div><div class="top"><div class="i">✕</div><div class="t">2 selected</div><div class="i">＋</div><div class="i">⤓</div><div class="i">🗑</div></div><div class="body"><div class="row"><div class="tile ini" style="border-radius:3px;width:22px;height:22px">✓</div><div class="g"><div class="l">Acts Of Magic</div><div class="s2">Boards of Canada · 1:18</div></div></div><div class="row"><div class="tile ini" style="border-radius:3px;width:22px;height:22px">✓</div><div class="g"><div class="l">Age Of Capricorn</div><div class="s2">Boards of Canada · 3:52</div></div></div><div class="row"><div class="tile ini" style="border-radius:3px;width:22px;height:22px"></div><div class="g"><div class="l">All At Once</div><div class="s2">Ninajirachi · 2:41</div></div></div><div class="row"><div class="tile ini" style="border-radius:3px;width:22px;height:22px"></div><div class="g"><div class="l">All I Am</div><div class="s2">Ninajirachi · 3:05</div></div></div></div><div class="mini"><div class="g"><div class="l">Battery Death</div><div class="s2">Ninajirachi</div></div><div class="pp">▶</div></div><div class="nav"><div><span>♫</span>Playlists</div><div><span>☺</span>Artists</div><div class="on"><span>≡</span>Songs</div><div><span>◉</span>Albums</div></div></div><figcaption><b>C · Hold = select, then act </b>Hold and let go selects (your rule P7, as in Tasks/Macros): checkboxes appear, the top bar offers Add to playlist · Download · Delete for all selected. Good for many songs at once.</figcaption></figure></div></section><section><h2>2 · Artist rows</h2><div class="grid"><figure><div class="phone" style="position:relative"><div class="status"><span>16:30</span><span>▮▮▮</span></div><div class="top"><div class="t">Artists</div><div class="i">☰</div><div class="i">⌕</div><div class="i">⤓</div><div class="i">⚙</div></div><div class="body"><div class="row"><div class="g"><div class="l">Boards of Canada</div><div class="s2">17 songs · 3 albums</div></div></div><div class="row"><div class="g"><div class="l">Cigarettes After Sex</div><div class="s2">1 song · 1 album</div></div></div><div class="row"><div class="g"><div class="l">Ninajirachi</div><div class="s2">11 songs · 1 album</div></div></div><div class="row"><div class="g"><div class="l">Parannoul</div><div class="s2">5 songs · 2 albums</div></div></div></div><div class="mini"><div class="g"><div class="l">Battery Death</div><div class="s2">Ninajirachi</div></div><div class="pp">▶</div></div><div class="nav"><div><span>♫</span>Playlists</div><div class="on"><span>☺</span>Artists</div><div ><span>≡</span>Songs</div><div><span>◉</span>Albums</div></div></div><figcaption><b>Now <span class="cur">now</span></b>Names and counts only; every row looks the same.</figcaption></figure><figure><div class="phone" style="position:relative"><div class="status"><span>16:30</span><span>▮▮▮</span></div><div class="top"><div class="t">Artists</div><div class="i">☰</div><div class="i">⌕</div><div class="i">⤓</div><div class="i">⚙</div></div><div class="body"><div class="row"><div class="tile"></div><div class="g"><div class="l">Boards of Canada</div><div class="s2">17 songs · 3 albums</div></div></div><div class="row"><div class="tile"></div><div class="g"><div class="l">Cigarettes After Sex</div><div class="s2">1 song · 1 album</div></div></div><div class="row"><div class="tile"></div><div class="g"><div class="l">Ninajirachi</div><div class="s2">11 songs · 1 album</div></div></div><div class="row"><div class="tile"></div><div class="g"><div class="l">Parannoul</div><div class="s2">5 songs · 2 albums</div></div></div></div><div class="mini"><div class="g"><div class="l">Battery Death</div><div class="s2">Ninajirachi</div></div><div class="pp">▶</div></div><div class="nav"><div><span>♫</span>Playlists</div><div class="on"><span>☺</span>Artists</div><div ><span>≡</span>Songs</div><div><span>◉</span>Albums</div></div></div><figcaption><b>A · Their newest album as a tile <span class="rec">suggested</span></b>The cover of the artist's latest album (already loaded for Albums) as a 48 dp tile, like album rows. Same look on both tabs; recognisable at a glance. Off with the Album covers switch.</figcaption></figure><figure><div class="phone" style="position:relative"><div class="status"><span>16:30</span><span>▮▮▮</span></div><div class="top"><div class="t">Artists</div><div class="i">☰</div><div class="i">⌕</div><div class="i">⤓</div><div class="i">⚙</div></div><div class="body"><div class="row"><div class="tile ini">Bo</div><div class="g"><div class="l">Boards of Canada</div><div class="s2">17 songs · 3 albums</div></div></div><div class="row"><div class="tile ini">CA</div><div class="g"><div class="l">Cigarettes After Sex</div><div class="s2">1 song · 1 album</div></div></div><div class="row"><div class="tile ini">N</div><div class="g"><div class="l">Ninajirachi</div><div class="s2">11 songs · 1 album</div></div></div><div class="row"><div class="tile ini">P</div><div class="g"><div class="l">Parannoul</div><div class="s2">5 songs · 2 albums</div></div></div></div><div class="mini"><div class="g"><div class="l">Battery Death</div><div class="s2">Ninajirachi</div></div><div class="pp">▶</div></div><div class="nav"><div><span>♫</span>Playlists</div><div class="on"><span>☺</span>Artists</div><div ><span>≡</span>Songs</div><div><span>◉</span>Albums</div></div></div><figcaption><b>B · Initials tile </b>A tile with the artist's initials, bold. No images, no loading, but less to remember them by.</figcaption></figure></div></section><section><h2>3 · Search before you type</h2><div class="grid"><figure><div class="phone" style="position:relative"><div class="status"><span>16:30</span><span>▮▮▮</span></div><div class="top"><div class="i">←</div><div class="pill">⌕ Search</div></div><div class="body"></div><div class="mini"><div class="g"><div class="l">Battery Death</div><div class="s2">Ninajirachi</div></div><div class="pp">▶</div></div></div><figcaption><b>Now <span class="cur">now</span></b>An empty page until you type.</figcaption></figure><figure><div class="phone" style="position:relative"><div class="status"><span>16:30</span><span>▮▮▮</span></div><div class="top"><div class="i">←</div><div class="pill">⌕ Search</div></div><div class="body"><div class="sect"><span>Recent</span><span>Clear</span></div><div class="row"><div class="g"><div class="l">radiohead</div><div class="s2">Artists · 3 found</div></div></div><div class="row"><div class="g"><div class="l">sunsetz</div><div class="s2">Songs · 12 found</div></div></div><div class="row"><div class="g"><div class="l">geogaddi</div><div class="s2">Albums · 2 found</div></div></div><div class="row"><div class="g"><div class="l">ninajirachi</div><div class="s2">Artists · 1 found</div></div></div></div><div class="mini"><div class="g"><div class="l">Battery Death</div><div class="s2">Ninajirachi</div></div><div class="pp">▶</div></div></div><figcaption><b>A · Your recent searches <span class="rec">suggested</span></b>The last six searches as rows; tap one to run it again (results come from the saved copy at once). From your own history, no guessing (pattern D1).</figcaption></figure><figure><div class="phone" style="position:relative"><div class="status"><span>16:30</span><span>▮▮▮</span></div><div class="top"><div class="i">←</div><div class="pill">⌕ Search</div></div><div class="body"><div class="sect"><span>Recent</span></div><div class="row"><div class="g"><div class="l">radiohead</div><div class="s2">Artists</div></div></div><div class="row"><div class="g"><div class="l">sunsetz</div><div class="s2">Songs</div></div></div><div class="sect"><span>Played lately</span></div><div class="row"><div class="tile"></div><div class="g"><div class="l">Geogaddi</div><div class="s2">Boards of Canada</div></div></div><div class="row"><div class="tile"></div><div class="g"><div class="l">I Love My Computer</div><div class="s2">Ninajirachi</div></div></div></div><div class="mini"><div class="g"><div class="l">Battery Death</div><div class="s2">Ninajirachi</div></div><div class="pp">▶</div></div></div><figcaption><b>B · Recent searches + recently played </b>As A, then the last albums you played, as cover rows. More to tap, a longer page.</figcaption></figure></div></section></div></body></html>
